<style>
  :root{
    --ink:#0E1117;
    --surface:#161B24;
    --surface-2:#1C232E;
    --border:#262F3C;
    --turq:#2BB8C6;      /* فیروزه‌ای */
    --turq-dim:#1d8a95;
    --saffron:#F4A93C;   /* زعفرانی */
    --text:#E8EDF3;
    --muted:#8A95A5;
    --done:#34c98a;
    --danger:#e06363;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{ -webkit-text-size-adjust:100%; }
  body{
    background:
      radial-gradient(1200px 600px at 100% -10%, rgba(43,184,198,.10), transparent 55%),
      radial-gradient(1000px 500px at 0% 0%, rgba(244,169,60,.07), transparent 50%),
      var(--ink);
    color:var(--text);
    font-family:'Vazirmatn',system-ui,sans-serif;
    min-height:100vh;
    line-height:1.6;
    padding-bottom:48px;
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 16px}

  /* Header */
  header{padding:calc(26px + env(safe-area-inset-top)) 16px 10px}
  .header-inner{max-width:760px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .title{font-size:30px;font-weight:900;letter-spacing:-.5px}
  .subtitle{color:var(--muted);font-size:14px;margin-top:2px}
  .week-pill{
    background:var(--surface);border:1px solid var(--border);border-radius:999px;
    padding:8px 14px;font-size:13px;color:var(--muted);white-space:nowrap
  }
  .week-pill b{color:var(--saffron);font-weight:700}

  /* Day selector */
  .days{display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px;scrollbar-width:none}
  .days::-webkit-scrollbar{display:none}
  .day-btn{
    flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;
    background:var(--surface);border:1px solid var(--border);border-radius:16px;
    padding:10px 16px;cursor:pointer;color:var(--muted);transition:.18s;min-width:78px
  }
  .day-btn .num{font-size:22px;font-weight:800;line-height:1;color:var(--text)}
  .day-btn .lbl{font-size:11px;font-weight:600;white-space:nowrap}
  .day-btn:hover{border-color:var(--turq-dim)}
  .day-btn.active{background:linear-gradient(180deg,rgba(43,184,198,.18),rgba(43,184,198,.06));border-color:var(--turq);color:var(--text)}
  .day-btn.active .num{color:var(--turq)}
  .day-btn.walk .num{font-size:18px;color:var(--saffron)}
  .day-btn.walk.active{background:linear-gradient(180deg,rgba(244,169,60,.18),rgba(244,169,60,.05));border-color:var(--saffron)}

  /* Day head */
  .day-head{display:flex;align-items:center;gap:16px;margin:18px 0 6px}
  .day-numeral{font-size:64px;font-weight:900;line-height:.8;color:var(--turq);opacity:.9}
  .walk-mode .day-numeral{color:var(--saffron);font-size:46px}
  .day-meta h2{font-size:22px;font-weight:800}
  .day-meta .tag{display:inline-block;margin-top:6px;font-size:12px;font-weight:600;color:var(--ink);background:var(--saffron);padding:3px 10px;border-radius:999px}

  /* Progress */
  .progress{margin:10px 0 4px}
  .bar{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden;border:1px solid var(--border)}
  .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--turq),var(--saffron));transition:width .35s ease;border-radius:999px}
  .progress .count{font-size:12px;color:var(--muted);margin-top:6px}
  .progress .count b{color:var(--text)}

  /* Section label */
  .sec-label{display:flex;align-items:center;gap:10px;margin:24px 0 10px;color:var(--muted)}
  .sec-label .ic{width:9px;height:9px;border-radius:3px;background:var(--turq)}
  .sec-label.warm .ic{background:var(--saffron)}
  .sec-label.finish .ic{background:var(--muted)}
  .sec-label h3{font-size:14px;font-weight:700;letter-spacing:.4px;color:var(--text)}
  .sec-label .line{flex:1;height:1px;background:var(--border)}

  /* Cards */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:14px;margin-bottom:12px;transition:.2s}
  .card.done{border-color:rgba(52,201,138,.45);background:linear-gradient(180deg,rgba(52,201,138,.06),transparent)}
  .card-row{display:flex;align-items:center;gap:12px}
  .num-badge{flex:0 0 auto;width:30px;height:30px;border-radius:10px;background:var(--surface-2);border:1px solid var(--border);
    display:grid;place-items:center;font-weight:800;font-size:14px;color:var(--turq)}
  .ex-name{flex:1;font-size:16px;font-weight:600}
  .scheme{flex:0 0 auto;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;
    padding:5px 11px;font-size:13px;font-weight:700;color:var(--saffron)}
  .scheme small{color:var(--muted);font-weight:500}
  .check{flex:0 0 auto;width:34px;height:34px;border-radius:50%;border:2px solid var(--border);background:transparent;
    cursor:pointer;display:grid;place-items:center;transition:.18s;color:transparent}
  .check:hover{border-color:var(--turq)}
  .check.on{background:var(--done);border-color:var(--done);color:#06140d}
  .check svg{width:16px;height:16px}

  .note-text{flex:1;font-size:15px;font-weight:500;color:var(--text)}
  .or-divider{text-align:center;color:var(--muted);font-size:13px;font-weight:700;margin:2px 0}

  /* GIF slot */
  .gif-wrap{margin-top:12px}
  .gif-slot{position:relative;width:100%;aspect-ratio:16/10;border-radius:14px;overflow:hidden;
    border:2px dashed var(--border);background:var(--surface-2);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:.18s;color:var(--muted)}
  .gif-slot:hover{border-color:var(--turq);color:var(--turq)}
  .gif-slot .play{width:46px;height:46px;border-radius:50%;border:2px solid currentColor;display:grid;place-items:center}
  .gif-slot .play svg{width:20px;height:20px;margin-right:-2px}
  .gif-slot .hint{font-size:13px;font-weight:600}
  .gif-slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#0a0d12}
  .gif-tools{display:none;gap:8px;margin-top:8px}
  .gif-tools.show{display:flex}
  .mini-btn{flex:1;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;color:var(--text);
    padding:8px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer}
  .mini-btn:hover{border-color:var(--turq)}
  .mini-btn.del:hover{border-color:var(--danger);color:var(--danger)}

  .gif-add{display:none;margin-top:10px;gap:8px;flex-wrap:wrap}
  .gif-add.show{display:flex}
  .gif-add input[type=text]{flex:1;min-width:160px;background:var(--surface-2);border:1px solid var(--border);
    border-radius:10px;color:var(--text);padding:9px 12px;font-family:inherit;font-size:13px;direction:ltr;text-align:left}
  .gif-add input[type=text]:focus{outline:none;border-color:var(--turq)}
  .file-label{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:9px 12px;
    font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
  .file-label:hover{border-color:var(--turq)}
  .file-label input{display:none}
  .go-btn{background:var(--turq);color:var(--ink);border:none;border-radius:10px;padding:9px 16px;font-family:inherit;
    font-weight:700;font-size:13px;cursor:pointer}

  /* Walking page */
  .walk-block{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px;margin-bottom:14px}
  .walk-block h4{font-size:15px;font-weight:700;margin-bottom:12px;color:var(--saffron)}
  .steps-row{display:flex;gap:12px}
  .step-card{flex:1;background:var(--surface-2);border:1px solid var(--border);border-radius:14px;padding:16px;text-align:center}
  .step-card .big{font-size:30px;font-weight:900;color:var(--text)}
  .step-card .sm{font-size:12px;color:var(--muted);margin-top:2px}
  .step-card.goal .big{color:var(--saffron)}
  .walk-note{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--border)}
  .walk-note:first-of-type{border-top:none}
  .walk-note .dot{flex:0 0 auto;margin-top:7px;width:8px;height:8px;border-radius:50%;background:var(--turq)}
  .walk-note .wt b{display:block;font-size:13px;color:var(--muted);font-weight:600;margin-bottom:2px}
  .walk-note .wt span{font-size:15px;font-weight:600}

  footer{text-align:center;color:var(--muted);font-size:12px;padding:24px 16px 0}
  @media (max-width:480px){
    .title{font-size:25px}
    .day-numeral{font-size:52px}
    .ex-name{font-size:15px}
    .steps-row{flex-direction:column}
  }
</style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div>
        <div class="title">برنامهٔ تمرینی</div>
        <div class="subtitle">۵ روز تمرین + پیاده‌روی روزانه</div>
      </div>
      <div class="week-pill">امروز تمام شد: <b id="weekPct">۰٪</b></div>
    </div>
    <div class="wrap">
      <div class="days" id="days"></div>
    </div>
  </header>

  <main class="wrap" id="content"></main>

  <footer>برای هر حرکت می‌توانی گیف نمایش حرکت را اضافه کنی — روی کادر گیف بزن.</footer>

<script>
const fa = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);

// ---- Plan data ----
const PLAN = [
  {
    numeral:'۱', title:'پا و باسن', tag:'سنگین',
    sections:[
      {label:'گرم کردن', kind:'warm', items:[{type:'note', name:'۱۰ دقیقه تردمیل شیب‌دار'}]},
      {label:'تمرین', kind:'main', items:[
        {type:'ex', name:'اسکوات', scheme:'4 × 10'},
        {type:'ex', name:'هیپ تراست', scheme:'4 × 12'},
        {type:'ex', name:'پرس پا', scheme:'4 × 12'},
        {type:'ex', name:'ددلیفت رومانیایی', scheme:'3 × 12'},
        {type:'ex', name:'دستگاه ابداکتور (باز کردن پا)', scheme:'4 × 15'},
      ]},
      {label:'آخر تمرین', kind:'finish', items:[{type:'note', name:'۲۰ دقیقه پیاده‌روی شیب‌دار'}]},
    ]
  },
  {
    numeral:'۲', title:'پشت، بازو، سرشانه', tag:null,
    sections:[
      {label:'تمرین', kind:'main', items:[
        {type:'ex', name:'لت پول‌داون', scheme:'4 × 12'},
        {type:'ex', name:'قایقی سیم‌کش', scheme:'4 × 12'},
        {type:'ex', name:'فیس پول', scheme:'3 × 15'},
        {type:'ex', name:'پرس سرشانه دستگاه', scheme:'3 × 12'},
        {type:'ex', name:'پشت بازو سیم‌کش', scheme:'3 × 15'},
        {type:'ex', name:'جلو بازو دمبل', scheme:'3 × 15'},
      ]},
      {label:'آخر تمرین', kind:'finish', items:[{type:'note', name:'۲۰ دقیقه تردمیل'}]},
    ]
  },
  {
    numeral:'۳', title:'چربی‌سوزی', tag:'هوازی',
    sections:[
      {label:'هوازی (یکی را انتخاب کن)', kind:'main', items:[
        {type:'note', name:'۴۵ تا ۶۰ دقیقه پیاده‌روی تند'},
        {type:'or'},
        {type:'note', name:'۳۰ دقیقه تردمیل با شیب ۸ تا ۱۲'},
      ]},
      {label:'سپس', kind:'main', items:[
        {type:'ex', name:'پلانک', scheme:'3 نوبت'},
        {type:'ex', name:'کرانچ', scheme:'3 × 15'},
        {type:'ex', name:'بالا آوردن پا', scheme:'3 × 15'},
      ]},
    ]
  },
  {
    numeral:'۴', title:'پا و باسن', tag:'فرم‌دهی',
    sections:[
      {label:'تمرین', kind:'main', items:[
        {type:'ex', name:'هیپ تراست', scheme:'5 × 10'},
        {type:'ex', name:'لانج راه‌رفتنی', scheme:'3 × 12', sub:'هر پا'},
        {type:'ex', name:'ددلیفت رومانیایی', scheme:'4 × 10'},
        {type:'ex', name:'استپ‌آپ روی نیمکت', scheme:'3 × 12'},
        {type:'ex', name:'دستگاه ابداکتور', scheme:'4 × 15'},
      ]},
      {label:'آخر تمرین', kind:'finish', items:[{type:'note', name:'۲۰ دقیقه پیاده‌روی'}]},
    ]
  },
  {
    numeral:'۵', title:'بالاتنه', tag:null,
    sections:[
      {label:'تمرین', kind:'main', items:[
        {type:'ex', name:'لت پول‌داون', scheme:'4 × 12'},
        {type:'ex', name:'قایقی', scheme:'4 × 12'},
        {type:'ex', name:'پرس سینه دستگاه', scheme:'3 × 12'},
        {type:'ex', name:'پرس سرشانه', scheme:'3 × 12'},
        {type:'ex', name:'پشت بازو سیم‌کش', scheme:'3 × 15'},
        {type:'ex', name:'جلو بازو دمبل', scheme:'3 × 15'},
      ]},
      {label:'آخر تمرین', kind:'finish', items:[{type:'note', name:'۲۰ دقیقه هوازی'}]},
    ]
  },
];

const WALK = {
  numeral:'🚶', title:'پیاده‌روی',
  daily:[{big:'۸۰۰۰', sm:'حداقل قدم روزانه'},{big:'۱۰۰۰۰', sm:'هدف اصلی', goal:true}],
  notes:[
    {b:'اگر روز باشگاه می‌روی', s:'۲۰ دقیقه آخر تمرین کافی است.'},
    {b:'اگر روز استراحت است', s:'۴۵ دقیقه پیاده‌روی تند.'},
  ]
};

// in-memory state: done flags + gif sources, keyed by day-section-item
let state = {};
try { state = JSON.parse(localStorage.getItem('workoutState') || '{}'); } catch(e){ state = {}; }
function save(){
  const clean = {};
  for(const k in state){
    const o = state[k]; if(!o) continue;
    const e = {};
    if(o.done) e.done = true;
    if(o.gif && !o.gif.startsWith('blob:')) e.gif = o.gif; // blob: (uploaded files) can't persist
    if(Object.keys(e).length) clean[k] = e;
  }
  try { localStorage.setItem('workoutState', JSON.stringify(clean)); } catch(e){}
}
let activeDay = 0;

const checkSVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
const playSVG = '<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20"/></svg>';

function key(d,s,i){return `${d}-${s}-${i}`;}

function exerciseCount(dayIdx){
  let total=0, done=0;
  PLAN[dayIdx].sections.forEach((sec,s)=>sec.items.forEach((it,i)=>{
    if(it.type==='ex'||it.type==='note'){
      total++;
      if(state[key(dayIdx,s,i)]?.done) done++;
    }
  }));
  return {total,done};
}

function buildDays(){
  const el = document.getElementById('days');
  el.innerHTML='';
  PLAN.forEach((d,idx)=>{
    const b=document.createElement('button');
    b.className='day-btn'+(idx===activeDay?' active':'');
    b.innerHTML=`<span class="num">${d.numeral}</span><span class="lbl">${d.title}</span>`;
    b.onclick=()=>{activeDay=idx;render();};
    el.appendChild(b);
  });
  const w=document.createElement('button');
  w.className='day-btn walk'+(activeDay==='walk'?' active':'');
  w.innerHTML=`<span class="num">🚶</span><span class="lbl">پیاده‌روی</span>`;
  w.onclick=()=>{activeDay='walk';render();};
  el.appendChild(w);
}

function gifSlotHTML(k){
  const src = state[k]?.gif;
  if(src){
    return `<div class="gif-wrap">
      <div class="gif-slot" data-k="${k}"><img src="${src}" alt="نمایش حرکت"></div>
      <div class="gif-tools show">
        <button class="mini-btn" data-act="change" data-k="${k}">تغییر گیف</button>
        <button class="mini-btn del" data-act="del" data-k="${k}">حذف</button>
      </div>
      ${addRow(k)}
    </div>`;
  }
  return `<div class="gif-wrap">
    <div class="gif-slot" data-act="open" data-k="${k}">
      <div class="play">${playSVG}</div>
      <div class="hint">افزودن گیف نمایش حرکت</div>
    </div>
    ${addRow(k)}
  </div>`;
}
function addRow(k){
  return `<div class="gif-add" id="add-${k}">
    <label class="file-label">انتخاب فایل<input type="file" accept="image/*" data-file="${k}"></label>
    <input type="text" placeholder="https://...  (آدرس گیف)" data-url="${k}">
    <button class="go-btn" data-url-go="${k}">نمایش</button>
  </div>`;
}

function render(){
  buildDays();
  const c=document.getElementById('content');
  c.innerHTML='';
  if(activeDay==='walk'){ renderWalk(c); document.getElementById('weekPct').textContent='—'; bind(); return; }

  const d=PLAN[activeDay];
  const {total,done}=exerciseCount(activeDay);
  const pct = total? Math.round(done/total*100):0;
  document.getElementById('weekPct').textContent = fa(pct)+'٪';

  let html = `
    <div class="day-head">
      <div class="day-numeral">${d.numeral}</div>
      <div class="day-meta">
        <h2>${d.title}</h2>
        ${d.tag?`<span class="tag">${d.tag}</span>`:''}
      </div>
    </div>
    <div class="progress">
      <div class="bar"><i style="width:${pct}%"></i></div>
      <div class="count"><b>${fa(done)}</b> از <b>${fa(total)}</b> حرکت انجام شد</div>
    </div>`;

  d.sections.forEach((sec,s)=>{
    const cls = sec.kind==='warm'?'warm':sec.kind==='finish'?'finish':'';
    html+=`<div class="sec-label ${cls}"><span class="ic"></span><h3>${sec.label}</h3><span class="line"></span></div>`;
    let num=0;
    sec.items.forEach((it,i)=>{
      const k=key(activeDay,s,i);
      const isDone = state[k]?.done;
      if(it.type==='or'){ html+=`<div class="or-divider">— یا —</div>`; return; }
      if(it.type==='ex'){
        num++;
        html+=`<div class="card ${isDone?'done':''}">
          <div class="card-row">
            <div class="num-badge">${fa(num)}</div>
            <div class="ex-name">${it.name}</div>
            <div class="scheme">${it.scheme}${it.sub?` <small>${it.sub}</small>`:''}</div>
            <button class="check ${isDone?'on':''}" data-done="${k}">${checkSVG}</button>
          </div>
          ${gifSlotHTML(k)}
        </div>`;
      } else { // note
        html+=`<div class="card ${isDone?'done':''}">
          <div class="card-row">
            <div class="note-text">${it.name}</div>
            <button class="check ${isDone?'on':''}" data-done="${k}">${checkSVG}</button>
          </div>
        </div>`;
      }
    });
  });
  c.innerHTML=html;
  bind();
}

function renderWalk(c){
  c.innerHTML=`
    <div class="day-head walk-mode">
      <div class="day-numeral">🚶</div>
      <div class="day-meta"><h2>پیاده‌روی</h2><span class="tag">هر روز</span></div>
    </div>
    <div class="walk-block">
      <h4>هدف قدم روزانه</h4>
      <div class="steps-row">
        ${WALK.daily.map(s=>`<div class="step-card ${s.goal?'goal':''}"><div class="big">${s.big}</div><div class="sm">${s.sm}</div></div>`).join('')}
      </div>
    </div>
    <div class="walk-block">
      <h4>بسته به نوع روز</h4>
      ${WALK.notes.map(n=>`<div class="walk-note"><span class="dot"></span><div class="wt"><b>${n.b}</b><span>${n.s}</span></div></div>`).join('')}
    </div>`;
}

function bind(){
  // done toggles
  document.querySelectorAll('[data-done]').forEach(b=>{
    b.onclick=()=>{
      const k=b.dataset.done;
      state[k]=state[k]||{};
      state[k].done=!state[k].done;
      save();
      render();
    };
  });
  // open add row
  document.querySelectorAll('[data-act="open"]').forEach(el=>{
    el.onclick=()=>{ document.getElementById('add-'+el.dataset.k)?.classList.toggle('show'); };
  });
  document.querySelectorAll('[data-act="change"]').forEach(el=>{
    el.onclick=()=>{ document.getElementById('add-'+el.dataset.k)?.classList.toggle('show'); };
  });
  document.querySelectorAll('[data-act="del"]').forEach(el=>{
    el.onclick=()=>{ const k=el.dataset.k; if(state[k])state[k].gif=null; save(); render(); };
  });
  // file picker
  document.querySelectorAll('[data-file]').forEach(inp=>{
    inp.onchange=e=>{
      const k=inp.dataset.file; const f=e.target.files[0];
      if(!f)return;
      state[k]=state[k]||{};
      state[k].gif=URL.createObjectURL(f);
      save();
      render();
    };
  });
  // url submit
  document.querySelectorAll('[data-url-go]').forEach(btn=>{
    btn.onclick=()=>{
      const k=btn.dataset.urlGo;
      const inp=document.querySelector(`[data-url="${k}"]`);
      const v=(inp?.value||'').trim();
      if(!v)return;
      state[k]=state[k]||{};
      state[k].gif=v;
      save();
      render();
    };
  });
  document.querySelectorAll('[data-url]').forEach(inp=>{
    inp.onkeydown=e=>{ if(e.key==='Enter'){ document.querySelector(`[data-url-go="${inp.dataset.url}"]`)?.click(); } };
  });
}

render();
</script>
</body>
</html>
